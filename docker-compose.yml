version: "3.9"

services:
  db:
    image: postgres:16
    container_name: cancer_postgres
    restart: always
    environment:
      POSTGRES_DB: cancer_db
      POSTGRES_USER: cancer_user
      POSTGRES_PASSWORD: cancer_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cancer_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancer_user -d cancer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  flask_ai:
    build: ./flask_ai
    container_name: cancer_flask_ai
    restart: always
    environment:
      HOST: "0.0.0.0"
      PORT: 5000
      DEBUG: "True"
    ports:
      - "5000:5000"
    networks:
      - cancer_network

  web:
    build: ./django_app
    container_name: cancer_django_web
    restart: always
    environment:
      POSTGRES_DB: cancer_db
      POSTGRES_USER: cancer_user
      POSTGRES_PASSWORD: cancer_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLASK_AI_URL: http://flask_ai:5000
      SECRET_KEY: django-insecure-cancer-detection-system-secret-key-quantathon
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./django_app/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      flask_ai:
        condition: service_started
    networks:
      - cancer_network

volumes:
  postgres_data:

networks:
  cancer_network: