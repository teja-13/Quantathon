version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: cancer_postgres

    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    networks:
      - cancer_network

volumes:

  postgres_data:

networks:

  cancer_network: