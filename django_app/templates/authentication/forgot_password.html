{% extends 'base/base.html' %}

{% block title %}Reset Password - OncoVision AI{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center min-vh-100 py-5">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card med-card p-4 p-md-5 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="rounded-3 p-3 text-warning bg-warning bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                    <i class="bi bi-key-fill fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Forgot Password</h3>
                <p class="text-muted small">Enter your registered email to receive reset instructions</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Registered Physician Email</label>
                    {{ form.email }}
                </div>
                <button type="submit" class="btn btn-primary-med w-100 py-2.5 mt-2 fw-semibold">
                    <i class="bi bi-send me-2"></i> Send Reset Link
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="{% url 'accounts:login' %}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
